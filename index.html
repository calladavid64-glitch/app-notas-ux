<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis notas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Mis notas</h1>
    <p class="ayuda">Escribe tu nota. El botón se activa cuando hay texto.</p>

    <form id="formulario">
      <label for="texto">Nueva nota</label>
      <input id="texto" type="text" maxlength="100" autocomplete="off">
      <button type="submit" id="agregar" class="boton-principal" disabled>Agregar nota</button>
    </form>

    <p id="mensaje" class="mensaje" role="status"></p>

    <h2>Tus notas</h2>
    <p id="vacio" class="ayuda">Aún no tienes notas.</p>
    <ul id="lista"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
